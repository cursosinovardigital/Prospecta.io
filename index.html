<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospecta.io - Prospecção Real & IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen pb-12">

    <header class="bg-gray-800 border-b border-gray-700 py-4 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Prospecta.io <span class="text-emerald-400 text-xs uppercase px-2 py-0.5 bg-emerald-950 border border-emerald-800 rounded-full ml-2">Turbo Maps</span></h1>
            <div class="flex bg-gray-900 p-1 rounded-lg border border-gray-700">
                <button onclick="switchTab('search')" id="tab-search" class="px-4 py-1.5 rounded-md text-sm font-medium bg-indigo-600 text-white transition">Prospectar</button>
                <button onclick="switchTab('clients')" id="tab-clients" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-400 hover:text-white transition">Clientes ($)</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-8 space-y-6">
        <section id="section-search" class="space-y-6">
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Nicho</label>
                        <input type="text" id="inputNiche" placeholder="Ex: pizzaria, oficina" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Cidade</label>
                        <input type="text" id="inputCity" placeholder="Ex: Guarulhos" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="flex items-end">
                        <button onclick="searchRealLeads()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                            <i class="fa-solid fa-magnifying-glass"></i> Buscar leads
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <p class="text-xs text-gray-400">Total Encontrados</p>
                    <h3 id="statTotal" class="text-2xl font-bold text-white">0</h3>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <p class="text-xs text-gray-400">Sem Site (Alvos)</p>
                    <h3 id="statNoSite" class="text-2xl font-bold text-amber-400">0</h3>
                </div>
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <p class="text-xs text-gray-400">Status</p>
                    <h3 id="searchStatus" class="text-xs font-bold text-emerald-400 mt-2">Pronto</h3>
                </div>
            </div>

            <div class="bg-gray-800 rounded-2xl border border-gray-700 shadow-xl overflow-hidden">
                <div class="overflow-x-auto max-h-[500px]">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-gray-900">
                            <tr class="text-gray-400 text-xs border-b border-gray-700 uppercase">
                                <th class="p-4">Empresa</th>
                                <th class="p-4">Web</th>
                                <th class="p-4">Endereço</th>
                                <th class="p-4">WhatsApp</th>
                                <th class="p-4 text-right">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="leadsTableBody" class="divide-y divide-gray-700 text-sm">
                            <tr><td colspan="5" class="p-8 text-center text-gray-500">Faça uma busca acima para montar a sua fila.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="section-clients" class="hidden space-y-6">
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
                <h2 class="text-lg font-bold">Clientes Fechados</h2>
                <div id="clientsList" class="mt-4 text-gray-400 text-sm">Nenhum cliente registrado ainda.</div>
            </div>
        </section>
    </main>

    <script>
        let currentLeads = [];

        function switchTab(tab) {
            document.getElementById('section-search').classList.toggle('hidden', tab !== 'search');
            document.getElementById('section-clients').classList.toggle('hidden', tab !== 'clients');
        }

        async function searchRealLeads() {
            const niche = document.getElementById('inputNiche').value.trim();
            const city = document.getElementById('inputCity').value.trim();
            const statusEl = document.getElementById('searchStatus');

            if(!niche || !city) {
                alert('Preencha o nicho e a cidade.');
                return;
            }

            statusEl.innerText = "Buscando no mapa real...";

            try {
                // Requisição limpa direto para a rota local do servidor
                const res = await fetch(`/api/buscar-empresas?niche=${encodeURIComponent(niche)}&city=${encodeURIComponent(city)}`);
                const data = await res.json();

                if(data.success && data.leads) {
                    currentLeads = data.leads;
                    document.getElementById('statTotal').innerText = currentLeads.length;
                    document.getElementById('statNoSite').innerText = currentLeads.filter(l => !l.hasSite).length;
                    renderTable();
                    statusEl.innerText = `${currentLeads.length} encontrados!`;
                } else {
                    statusEl.innerText = data.error || "Nenhum resultado.";
                }
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Erro ao conectar ao servidor.";
            }
        }

        function renderTable() {
            const tbody = document.getElementById('leadsTableBody');
            tbody.innerHTML = '';
            if(currentLeads.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Nenhum estabelecimento com telefone encontrado.</td></tr>`;
                return;
            }

            currentLeads.forEach((lead) => {
                const msg = encodeURIComponent(`Olá ${lead.name}, tudo bem? Sou desenvolvedor web aqui na região...`);
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-750 border-b border-gray-700/50">
                        <td class="p-4 font-medium text-white">${lead.name}</td>
                        <td class="p-4">${lead.hasSite ? '<span class="text-emerald-400 text-xs">Com Site</span>' : '<span class="text-amber-400 text-xs font-bold">Sem Site</span>'}</td>
                        <td class="p-4 text-xs text-gray-300">${lead.address}</td>
                        <td class="p-4 text-xs text-gray-300">+55 ${lead.phone}</td>
                        <td class="p-4 text-right">
                            <a href="https://wa.me/55${lead.phone}?text=${msg}" target="_blank" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium">Abordar</a>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
